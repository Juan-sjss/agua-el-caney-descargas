name: Mantener despierta la API

on:
  schedule:
    # Cada 10 minutos: el plan gratuito de Render suspende el servicio tras 15 minutos sin uso.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar y verificar la API
        run: |
          for intento in 1 2 3; do
            echo "Intento $intento"
            codigo=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 https://el-caney-api.onrender.com/health || true)
            echo "HTTP $codigo"
            if [ "$codigo" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "La API no respondió 200; se reintentará en la próxima ejecución."
